name: Deploy-Time Admission Gate

# Phase 4a — evaluates the actual terraform plan (not just static source,
# which is Checkov's job in Phase 3) against OPA/conftest policies.
# Needs a real terraform plan, which needs a real LocalStack to plan
# against — so LocalStack runs as a disposable service container for the
# duration of this job, not something borrowed from any long-lived
# instance. Self-contained, same as any other CI job.

on:
  push:
    branches: [main]
    paths:
      - "infra/bootstrap/**"
      - "infra/environments/dev/**"
      - "policies/opa/**"
      - ".github/workflows/admission-gate.yml"
  pull_request:
    branches: [main]
    paths:
      - "infra/bootstrap/**"
      - "infra/environments/dev/**"
      - "policies/opa/**"
      - ".github/workflows/admission-gate.yml"

jobs:
  opa-conftest:
    name: OPA / conftest (terraform plan)
    runs-on: ubuntu-latest

    # LocalStack is started as an ordinary step below rather than through
    # `services:`. GitHub's service-container machinery gates the whole
    # job on Docker health status before any step runs, and it breaks
    # both ways with this image: the image's own strict HEALTHCHECK times
    # out, and --no-healthcheck makes the runner's own inspect template
    # fail (Config.Healthcheck is set to {"Test":["NONE"]}, which is
    # truthy, but State.Health then doesn't exist). Starting the
    # container ourselves avoids that path entirely and leaves readiness
    # to the curl-polling step, which is the only check that actually
    # matters here.

    steps:
      - uses: actions/checkout@v4

      # Pinned to 4.0 (community edition) on purpose: localstack:latest
      # now requires a LOCALSTACK_AUTH_TOKEN and exits with code 55 the
      # moment it starts without one, which is what was actually failing
      # here — not the healthchecks it looked like at first. 4.0 runs
      # token-free and still provides every service this plan needs
      # (s3, dynamodb, iam, sts, ec2), verified against its health
      # endpoint. Local development still uses :latest with the token
      # from .env; only CI needs the token-free pin.
      - name: Start LocalStack
        run: |
          docker run -d --name localstack \
            -p 4566:4566 \
            -e SERVICES=s3,dynamodb,iam,sts,ec2 \
            localstack/localstack:4.0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.2"

      - name: Install conftest
        run: |
          curl -sL https://github.com/open-policy-agent/conftest/releases/download/v0.70.0/conftest_0.70.0_Linux_x86_64.tar.gz | tar xz
          sudo mv conftest /usr/local/bin/

      - name: Wait for LocalStack
        run: |
          for i in $(seq 1 45); do
            if curl -s http://localhost:4566/_localstack/health | grep -q '"s3": "available"'; then
              echo "LocalStack ready after ~$((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "LocalStack did not become ready within 90s. Container logs:"
          docker logs localstack
          exit 1

      - name: Bootstrap the remote state backend
        working-directory: infra/bootstrap
        run: |
          terraform init
          terraform apply -auto-approve

      - name: Plan the dev environment
        working-directory: infra/environments/dev
        run: |
          terraform init
          terraform plan -out=tfplan.binary
          terraform show -json tfplan.binary > tfplan.json

      - name: Run conftest against the plan
        run: conftest test --policy policies/opa infra/environments/dev/tfplan.json
