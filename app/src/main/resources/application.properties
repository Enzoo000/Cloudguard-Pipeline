# Northbound Analytics — target app for CloudGuard Pipeline
#
# SEEDED FLAW (hardcoded secret): app.secret signs every JWT this app
# issues (see AuthUtil). It's committed here in plaintext instead of
# coming from AWS Secrets Manager / an environment variable injected at
# deploy time. Anyone who reads this file — or the built jar — can forge
# a valid session for any user.
app.secret=8f2c9e1a-4b6d-4e7f-9a3c-2d5b7c8e1f0a

# SEEDED FLAW (path traversal): exports are served from this directory
# with no filename sanitization — see ReportController#export.
app.exportsDir=./exports

spring.datasource.url=jdbc:h2:mem:northbound;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

server.port=8080

# Only expose the health endpoint (used by the Docker HEALTHCHECK) —
# actuator's other endpoints (env, beans, etc.) can leak internals if
# left open by default.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
