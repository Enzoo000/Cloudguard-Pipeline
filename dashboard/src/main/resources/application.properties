# Port 8090 — app/ (the target application) holds 8080, and both need to
# be able to run at the same time.
server.port=8090

# File-backed H2 rather than in-memory: findings and remediation history
# should survive a dashboard restart, unlike app/'s throwaway demo data.
spring.datasource.url=jdbc:h2:file:./data/cloudguard;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
